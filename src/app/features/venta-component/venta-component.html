<div class="container-fluid py-4">

  <h2 class="mb-4">Reporte de Ventas</h2>

  <!-- RESUMEN -->
  <div class="row text-center mb-4">

    <div class="col-md-6">
      <div class="card shadow-sm p-3">
        <h6>Total Ventas</h6>
        <h3>{{ listaVentas.length }}</h3>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm p-3">
        <h6>Monto Vendido</h6>
        <h3>S/. {{ totalVentas }}</h3>
      </div>
    </div>

  </div>

  <hr>

  <!-- TABLA -->
  <div class="card shadow-sm p-3">

    <h5 class="mb-3">Detalle de Ventas</h5>

    <div class="table-responsive">

      <table class="table table-hover align-middle">

        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Vendedor</th>
            <th>Fecha</th>
            <th>Total</th>
          </tr>
        </thead>

        <tbody>

          @for(venta of listaVentas; track venta.id){

            <tr>

              <td>{{ venta.id }}</td>
              <td><strong>{{ venta.clienteId }}</strong></td>
              <td>{{ venta.vendedorId }}</td>
              <td>{{ venta.fecha }}</td>

              <td>
                <span class="badge bg-success">
                  S/. {{ venta.total }}
                </span>
              </td>

            </tr>

          }

        </tbody>

      </table>

    </div>

  </div>

</div>
