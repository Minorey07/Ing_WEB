<div class="container py-4">

  <h2 class="mb-4 text-center">Gestión de Compras</h2>

  <!-- FORMULARIO -->
  <div class="card shadow-sm p-4 mb-4">

    <form (submit)="guardar($event)">

      <div class="mb-3">
        <label class="form-label">ID Proveedor</label>
        <input
          type="number"
          class="form-control"
          [formField]="formularioCompra.proveedorId"
          placeholder="Ingrese ID del proveedor">
      </div>

      <div class="mb-3">
        <label class="form-label">Total Compra</label>
        <input
          type="number"
          class="form-control"
          [formField]="formularioCompra.total"
          placeholder="Ingrese monto total">
      </div>

      <button class="btn btn-primary w-100" type="submit">

        @if(modoEdicion){
          Actualizar Compra
        } @else {
          Guardar Compra
        }

      </button>

    </form>

  </div>

  <!-- RESUMEN -->
  <div class="row text-center mb-4">

    <div class="col-md-6">
      <div class="alert alert-info">
        Compras Registradas: <strong>{{ listaCompras.length }}</strong>
      </div>
    </div>

    <div class="col-md-6">
      <div class="alert alert-success">
        Monto Total Comprado: <strong>S/. {{ totalCompras }}</strong>
      </div>
    </div>

  </div>

  <!-- TABLA -->
  <div class="card shadow-sm p-3">

    <h4 class="mb-3">Lista de Compras</h4>

    <div class="table-responsive">

      <table class="table table-hover align-middle">

        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Proveedor ID</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>

          @for(compra of listaCompras; track compra.id){

            <tr>
              <td>{{ compra.id }}</td>
              <td>{{ compra.proveedorId }}</td>
              <td>{{ compra.fecha }}</td>
              <td>S/. {{ compra.total }}</td>

              <td class="d-flex gap-2">

                <button
                  type="button"
                  class="btn btn-warning btn-sm"
                  (click)="editar(compra)">
                  Editar
                </button>

                <button
                  type="button"
                  class="btn btn-danger btn-sm"
                  (click)="eliminar(compra.id)">
                  Eliminar
                </button>

              </td>

            </tr>

          }

        </tbody>

      </table>

    </div>

  </div>

</div>
