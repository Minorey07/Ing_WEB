<div class="d-flex justify-content-center align-items-center vh-100 bg-light"
     (keyup.enter)="ingresar()">

  <div class="card shadow p-4" style="width: 350px; border-radius: 12px;">

    <h4 class="text-center mb-4">
      Iniciar Sesión<br>
      <small class="text-muted">Melius S.A.C.</small>
    </h4>

    <div class="mb-3">
      <label class="form-label">Correo</label>
      <input
        type="email"
        class="form-control"
        placeholder="ej: admin@melius.com"
        [(ngModel)]="correo">
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input
        type="password"
        class="form-control"
        placeholder="••••••••"
        [(ngModel)]="password">
    </div>

    <button class="btn btn-primary w-100" (click)="ingresar()">
      Ingresar
    </button>

    <p class="text-center mt-3 text-danger">
      {{ mensaje }}
    </p>

  </div>
</div>
