services:
  - type: web
    name: melius
    runtime: python
    region: oregon
    buildCommand: bash build-render.sh
    startCommand: bash start-unified.sh
    
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
