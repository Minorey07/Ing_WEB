services:
  - type: web
    name: melius
    runtime: python
    region: oregon
    buildCommand: |
      cd melius-backend && pip install -r requirements.txt && cd .. && \
      cd Programa_Final_Frontend && npm install && npm run build && cd ..
    startCommand: bash ./start-unified.sh
    
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
